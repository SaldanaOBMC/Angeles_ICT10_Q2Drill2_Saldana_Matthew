<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 DRILL 1</title>

    <style>
        body {
            background-image: url("OBAN.webp");
            background-size: cover;
        }

        .box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

</head>

<body>

        <div class="row">

            <div class="col-md-4">

                    <input type="text" id="first_name" class="form-control mb-2" placeholder="First Name">

                    <input type="text" id="last_name" class="form-control mb-2" placeholder="Last Name">

                    <button class="btn btn-primary" id="add_button">Add Member</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="box">
                    <h3>Club Members</h3>

                    <div id="results">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>

</html>
